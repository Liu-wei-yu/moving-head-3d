<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MOVING HEAD · 光束灯教学模型</title>
<style>
  :root{
    --ink:#e9ebf0;
    --dim:#858c9b;
    --line:rgba(255,255,255,.075);
    --glass:rgba(17,19,24,.72);
    --accent:#f2b45c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#06070a;color:var(--ink);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- HUD ---------- */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hud > *{pointer-events:auto}

  .brand{position:absolute;left:34px;top:30px;line-height:1}
  .brand h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:.32em;
    color:#f4f5f8;text-transform:uppercase;
  }
  .brand h1 em{font-style:normal;color:var(--accent);letter-spacing:.1em}
  .brand p{
    margin:11px 0 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  .rule{width:38px;height:1px;background:linear-gradient(90deg,var(--accent),transparent);margin:14px 0 0}

  .dock{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:7px;
    background:var(--glass);border:1px solid var(--line);border-radius:999px;
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 18px 50px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:12.5px;letter-spacing:.08em;
    padding:9px 15px;border-radius:999px;cursor:pointer;
    transition:color .18s,background .18s,box-shadow .18s;
  }
  button:hover{color:#e9ebf0;background:rgba(255,255,255,.05)}
  button.on{color:#101216;background:var(--accent);box-shadow:0 0 22px -6px rgba(242,180,92,.65)}
  button.ghost.on{background:#e9ebf0;box-shadow:none}
  button:active{transform:translateY(1px)}

  .hint{
    position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
    font-size:11px;letter-spacing:.14em;color:#565d6b;white-space:nowrap;
    font-family:ui-monospace,Consolas,monospace;
  }
  .spec{
    position:absolute;right:34px;top:30px;text-align:right;
    font-size:11px;letter-spacing:.1em;color:var(--dim);
    font-family:ui-monospace,Consolas,monospace;line-height:1.9;
  }
  .spec b{color:#cfd4de;font-weight:500}

  .fallback{
    position:fixed;inset:0;display:none;place-items:center;z-index:50;
    background:#06070a;text-align:center;padding:30px;
  }
  .fallback div{max-width:420px;font-size:13px;line-height:2;color:#98a0ae}
  .fallback b{color:#f2b45c}

  @media (max-width:720px){
    .brand{left:20px;top:20px}
    .spec{display:none}
    .brand p{font-size:10px}
    button{padding:9px 11px;font-size:11.5px}
    .hint{display:none}
  }
</style>
</head>
<body>

<div class="hud">
  <div class="brand">
    <h1>Moving Head <em>Beam</em></h1>
    <p>PROCEDURAL · THREE.JS r186</p>
    <div class="rule"></div>
  </div>

  <div class="spec">
    <b>405 × 345 × 475</b> mm<br>
    BEAM 230 · 7R<br>

    <button data-mode="ghost">透视</button>
    <button data-mode="explode">爆炸</button>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   0. 渲染器 / 场景
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x080a0e, 2.2, 7.5);

// 深色渐变背景（贴在 CSS 之上，作为真实背景，fog 才能无缝融合）
(function background(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 512;
  const g = c.getContext('2d').createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#1b2028');
  g.addColorStop(0.42, '#0d1015');
  g.addColorStop(0.72, '#080a0e');
  g.addColorStop(1.00, '#050609');
  const ctx = c.getContext('2d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0.84, 0.56, 1.10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.255, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 0.55;
controls.maxDistance = 3.2;
controls.maxPolarAngle = Math.PI * 0.497;   // 不钻到地面以下
controls.minPolarAngle = Math.PI * 0.06;
controls.autoRotateSpeed = 0.55;
controls.update();

// 环境反射（自制冷色影棚 HDRI，避免暖褐偏色）
const pmrem = new THREE.PMREMGenerator(renderer);
(function environment(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#4a6178');
  g.addColorStop(0.30, '#22303f');
  g.addColorStop(0.62, '#0d131b');
  g.addColorStop(1.00, '#05070a');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256);
  // 顶部柔光带 —— 给金属一条干净的反射亮条
  const s = x.createLinearGradient(0, 34, 0, 96);
  s.addColorStop(0.00, 'rgba(255,255,255,0)');
  s.addColorStop(0.45, 'rgba(226,238,255,0.92)');
  s.addColorStop(1.00, 'rgba(255,255,255,0)');
  x.fillStyle = s; x.fillRect(70, 34, 372, 62);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.environment = pmrem.fromEquirectangular(tex).texture;
})();
scene.environmentIntensity = 0.55;

/* ============================================================
   1. 灯光
   ============================================================ */
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-0.85, 1.45, 1.05);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -0.42;
key.shadow.camera.right = 0.42;
key.shadow.camera.top = 0.55;
key.shadow.camera.bottom = -0.1;
key.shadow.camera.near = 0.6;
key.shadow.camera.far = 4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.008;
key.shadow.radius = 6;
key.shadow.blurSamples = 14;
scene.add(key);

const rim = new THREE.DirectionalLight(0x92b6ff, 2.3);
rim.position.set(1.5, 1.05, -1.35);
scene.add(rim);

const kick = new THREE.DirectionalLight(0xa8c2ff, 0.30);
kick.position.set(-1.35, 0.42, -1.1);
scene.add(kick);

const fill = new THREE.DirectionalLight(0xc8d8ff, 0.42);
fill.position.set(1.25, 0.30, 0.85);
scene.add(fill);

const topL = new THREE.DirectionalLight(0xdbe6ff, 0.55);
topL.position.set(0.2, 2.2, 0.15);
scene.add(topL);

scene.add(new THREE.HemisphereLight(0x2b3546, 0x040507, 0.55));

// 地面：虚空 + 影子接收面 + 极淡的接触光池
(function floor(){
  const shadowCatcher = new THREE.Mesh(
    new THREE.CircleGeometry(3.4, 64),
    new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.42 })
  );
  shadowCatcher.rotation.x = -Math.PI / 2;
  shadowCatcher.position.y = 0.0015;
  shadowCatcher.renderOrder = 2;
  shadowCatcher.receiveShadow = true;
  scene.add(shadowCatcher);

  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.00, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.16)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const pool = new THREE.Mesh(
    new THREE.PlaneGeometry(1.35, 1.35),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0x6d7f9e, opacity: 0.5 })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.renderOrder = 1;
  scene.add(pool);
})();

/* ============================================================
   2. 材质
   ============================================================ */
const P = THREE.MeshPhysicalMaterial;
const S = THREE.MeshStandardMaterial;

const M = {
  body:   new P({ color:0x191c22, metalness:0.16, roughness:0.46, clearcoat:0.22, clearcoatRoughness:0.6 }),
  accent: new P({ color:0x1d2027, metalness:0.42, roughness:0.30, clearcoat:0.35, clearcoatRoughness:0.4 }),
  matt:   new S({ color:0x0d0e12, metalness:0.05, roughness:0.72 }),
  steel:  new S({ color:0xc3c8d0, metalness:1.0, roughness:0.26 }),
  dark:   new S({ color:0x2a2e36, metalness:0.9, roughness:0.42 }),
  chrome: new S({ color:0xf0f3f7, metalness:1.0, roughness:0.055 }),
  rubber: new S({ color:0x080809, metalness:0.0, roughness:0.92 }),
  lens:   new P({ color:0x0e1c2c, metalness:0.0, roughness:0.04, clearcoat:1.0,
                  transparent:true, opacity:0.85, ior:1.52, envMapIntensity:2.4 }),
  glassc: new P({ color:0xbfe9ff, metalness:0.0, roughness:0.04, clearcoat:1.0,
                  transparent:true, opacity:0.34, envMapIntensity:1.6 }),
  pcb:    new S({ color:0x0d3a26, metalness:0.2, roughness:0.55 }),
  bowl:   new S({ color:0xf2f5fa, metalness:1.0, roughness:0.055, side:THREE.DoubleSide }),
  lcd:    new S({ color:0x061420, emissive:0x2f86c8, emissiveIntensity:1.35, roughness:0.2 }),
  blue:   new S({ color:0x1b4f8a, metalness:0.5, roughness:0.35 })
};
M.body.envMapIntensity = 0.7;
M.accent.envMapIntensity = 0.8;
M.accentDS = new P({ color:0x1d2027, metalness:0.42, roughness:0.30, clearcoat:0.35, clearcoatRoughness:0.4, side:THREE.DoubleSide });

// 幽灵（透视）材质
const GHOST = new P({
  color:0x8fb2da, metalness:0.0, roughness:0.06, clearcoat:1.0,
  transparent:true, opacity:0.062, depthWrite:false,
  side:THREE.DoubleSide, envMapIntensity:1.2
});

/* ============================================================
   3. 几何工具
   ============================================================ */
const housing = [];      // 可透视的外壳
const EXPLODE = [];      // 可爆炸的光学件

function mark(m, isHousing){
  m.receiveShadow = true;
  m.castShadow = !!isHousing;          // 只有外壳投影，内部件不投影（避免影子发脏）
  if (isHousing) { m.userData.solid = m.material; housing.push(m); }
  return m;
}

function roundedRectShape(w, h, r){
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  s.closePath();
  return s;
}

function octShape(w, d, c){
  const s = new THREE.Shape();
  const x = w/2, y = d/2;
  s.moveTo(-x + c, -y);
  s.lineTo(x - c, -y); s.lineTo(x, -y + c); s.lineTo(x, y - c);
  s.lineTo(x - c, y);  s.lineTo(-x + c, y); s.lineTo(-x, y - c);
  s.lineTo(-x, -y + c); s.closePath();
  return s;
}

function extrude(shape, depth, mat, bevel = 0.002, isHousing = true){
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel,
    bevelSegments:2, curveSegments:20, steps:1
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return mark(new THREE.Mesh(g, mat), isHousing);
}

// 沿 Y 轴的棱柱（底座、回转盘）
function prism(shape, height, mat, bevel = 0.002){
  const m = extrude(shape, height, mat, bevel);
  m.rotation.x = -Math.PI / 2;
  return m;
}

// 用 (z, y) 折线做一块沿 X 拉伸的板（轭架）
function plate(pts, thickness, mat, bevel = 0.004){
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  const m = extrude(s, thickness, mat, bevel);
  m.rotation.y = Math.PI / 2;   // 厚度转到 X 轴
  return m;
}

function cyl(r1, r2, h, mat, seg = 32){
  const g = new THREE.CylinderGeometry(r1, r2, h, seg);
  return mark(new THREE.Mesh(g, mat), false);
}

function disc(r, t, mat, seg = 48){
  const g = new THREE.CylinderGeometry(r, r, t, seg);
  return mark(new THREE.Mesh(g, mat), false);
}

function at(obj, x, y, z){ obj.position.set(x, y, z); return obj; }

/* ============================================================
   4. 尺寸（真机 Beam 230：405 × 345 × 475 mm）
   ============================================================ */
const BASE_W = 0.400, BASE_D = 0.300;
const ARM_X  = 0.158, ARM_T = 0.034;
const HEAD_W = 0.212, HEAD_H = 0.222, HEAD_L = 0.380;
const HEAD_Z0 = -0.200, HEAD_Z1 = 0.180;      // 光轴 = +Z
const TILT_Y = 0.395;
const DRUM_Y0 = 0.100, DRUM_Y1 = 0.166;

const root = new THREE.Group();
scene.add(root);

const pan  = new THREE.Group();  pan.position.y = 0.100;  root.add(pan);   // 绕 Y 旋转 360°
const tilt = new THREE.Group();  tilt.position.y = TILT_Y - 0.100; pan.add(tilt); // 绕 X 俯仰

/* ---------- 4.1 静止底座 ---------- */
const base = prism(octShape(BASE_W - 0.016, BASE_D - 0.016, 0.048), 0.070, M.body, 0.008);
at(base, 0, 0.047, 0);
root.add(base);

const baseTop = prism(octShape(BASE_W - 0.030, BASE_D - 0.030, 0.042), 0.008, M.accent, 0.003);
at(baseTop, 0, 0.086, 0);
root.add(baseTop);

// 脚垫
[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx, sz]) => {
  const f = cyl(0.014, 0.014, 0.014, M.rubber, 20);
  at(f, sx * 0.146, 0.007, sz * 0.108);
  root.add(f);
});

// 后面板：接口
const panel = new THREE.Mesh(new THREE.BoxGeometry(0.238, 0.052, 0.008), M.accent);
at(panel, 0, 0.048, -0.150);
root.add(mark(panel, true));

const xlrX = [-0.082, -0.044];
xlrX.forEach((x, i) => {
  const c = cyl(0.0105, 0.0105, 0.016, M.dark, 20); c.rotation.x = Math.PI / 2;
  at(c, x, 0.048, -0.156); root.add(c);
  const p = cyl(0.0078, 0.0078, 0.004, M.matt, 16); p.rotation.x = Math.PI / 2;
  at(p, x, 0.048, -0.163); root.add(p);
});
// powerCON
const pc = cyl(0.017, 0.017, 0.019, M.accent, 24); pc.rotation.x = Math.PI / 2;
at(pc, 0.006, 0.048, -0.156); root.add(pc);
const pcRing = new THREE.Mesh(new THREE.TorusGeometry(0.0125, 0.0032, 8, 24), M.blue);
at(pcRing, 0.006, 0.048, -0.166); root.add(mark(pcRing, false));
// 电源开关 + 保险
const sw = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.018, 0.010), M.accent);
at(sw, 0.060, 0.048, -0.155); root.add(mark(sw, true));
const fz = cyl(0.0088, 0.0088, 0.014, M.accent, 16); fz.rotation.x = Math.PI / 2;
at(fz, 0.102, 0.048, -0.156); root.add(fz);

// 前面板：LCD + 按键
const lcdFrame = new THREE.Mesh(new THREE.BoxGeometry(0.092, 0.062, 0.006), M.accent);
at(lcdFrame, 0.012, 0.045, 0.148); root.add(mark(lcdFrame, true));
const lcd = new THREE.Mesh(new THREE.BoxGeometry(0.076, 0.046, 0.004), M.lcd);
at(lcd, 0.012, 0.045, 0.152); root.add(lcd);
[-0.108, -0.090, -0.072, -0.054].forEach(x => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.011, 0.005), M.accent);
  at(b, x, 0.045, 0.150); root.add(mark(b, true));
});
const knob = cyl(0.0115, 0.0115, 0.012, M.steel, 24); knob.rotation.x = Math.PI / 2;
at(knob, 0.086, 0.045, 0.154); root.add(knob);

// 侧面散热百叶
for (const s of [1, -1]) {
  for (let i = 0; i < 5; i++) {
    const v = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.007, 0.034), M.matt);
    at(v, s * (BASE_W/2 - 0.001), 0.050, -0.062 + i * 0.031);
    root.add(mark(v, true));
  }
}

/* ---------- 4.1b 底座内部（电气层） ---------- */
{
  const pcb = new THREE.Mesh(new THREE.BoxGeometry(0.212, 0.006, 0.150), M.pcb);
  at(pcb, 0, 0.021, 0.006); root.add(mark(pcb, false));

  for (let i = 0; i < 10; i++) {
    const w = 0.014 + (i % 3) * 0.006;
    const ch = new THREE.Mesh(new THREE.BoxGeometry(w, 0.005, 0.010), M.dark);
    at(ch, -0.072 + i * 0.016, 0.027, -0.010 + (i % 3) * 0.014);
    root.add(mark(ch, false));
  }
  for (let i = 0; i < 3; i++) {
    const cap = cyl(0.0065, 0.0065, 0.018, M.dark, 14);
    at(cap, 0.056 + i * 0.016, 0.034, 0.040);
    root.add(cap);
  }
  // 电源模块
  const psu = new THREE.Mesh(new THREE.BoxGeometry(0.104, 0.046, 0.070), M.dark);
  at(psu, -0.098, 0.049, -0.062); root.add(mark(psu, false));
  const psuFin = new THREE.Mesh(new THREE.BoxGeometry(0.100, 0.040, 0.004), M.matt);
  at(psuFin, -0.098, 0.049, -0.098); root.add(mark(psuFin, false));

  // pan 电机 + 编码器（静止侧）
  const pMotor = cyl(0.021, 0.021, 0.052, M.dark, 22);
  at(pMotor, 0.058, 0.062, -0.052); root.add(mark(pMotor, false));
  const pEnc = cyl(0.013, 0.013, 0.022, M.dark, 16);
  at(pEnc, -0.048, 0.048, -0.052); root.add(mark(pEnc, false));

  // 内部线束
  const wireMat = new THREE.MeshStandardMaterial({ color:0x0c0c0e, roughness:0.75 });
  [[0.070, -0.030, 0.040], [0.020, -0.078, 0.010]].forEach(([x, z, spread]) => {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(x, 0.026, z),

// 收顶：上窄下宽
function taper(g, halfH, kTop, kBot){
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    const t = y > 0 ? (y / halfH) * kTop : (-y / halfH) * kBot;
    p.setX(i, p.getX(i) * (1 - t));
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

/* ============================================================
   6. 模式 / 交互
   ============================================================ */
const state = { mode: 'solid', p: 0, target: 0, ghost: 0, ghostTarget: 0, auto: true };

function setMode(mode){
  state.mode = mode;
  state.ghostTarget = (mode === 'solid') ? 0 : 1;
  state.target = (mode === 'explode') ? 1 : 0;
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
}

document.querySelectorAll('[data-mode]').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));

const btnRotate = document.getElementById('btnRotate');
btnRotate.addEventListener('click', () => {
  state.auto = !state.auto;
  controls.autoRotate = state.auto;
  btnRotate.classList.toggle('on', state.auto);
});

const home = { pos: new THREE.Vector3(0.84, 0.56, 1.10), tgt: new THREE.Vector3(0, 0.255, 0) };
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.copy(home.pos);
  controls.target.copy(home.tgt);
  controls.update();
});

addEventListener('keydown', e => {
  if (e.code === 'KeyR') { camera.position.copy(home.pos); controls.target.copy(home.tgt); controls.update(); }
  if (e.code === 'Space') { e.preventDefault(); btnRotate.click(); }
  if (e.code === 'Digit1') setMode('solid');
  if (e.code === 'Digit2') setMode('ghost');
  if (e.code === 'Digit3') setMode('explode');
});

// 拖拽时暂停自动旋转
let resumeTimer = null;
renderer.domElement.addEventListener('pointerdown', () => {
  controls.autoRotate = false;
  clearTimeout(resumeTimer);
});
renderer.domElement.addEventListener('pointerup', () => {
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => { if (state.auto) controls.autoRotate = true; }, 1600);
});

controls.autoRotate = true;

// 视图参数（可分享 / 自检）：?mode=ghost&cam=1.1,0.6,0.9&tgt=0,0.28,0
(function urlViews(){
  const q = new URLSearchParams(location.search);
  const num = s => s.split(',').map(Number);
  if (q.get('cam')) camera.position.set(...num(q.get('cam')));
  if (q.get('tgt')) controls.target.set(...num(q.get('tgt')));
  if (q.get('mode')) setMode(q.get('mode'));
  controls.update();
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   7. 主循环
   ============================================================ */
let lastT = performance.now();
let appliedGhost = -1;

function animate(){
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // 平滑过渡
  state.ghost += (state.ghostTarget - state.ghost) * Math.min(1, dt * 7);
  state.p     += (state.target     - state.p)     * Math.min(1, dt * 5);

  // 外壳材质：实体 / 幽灵
  if (Math.abs(state.ghost - appliedGhost) > 0.004){
    appliedGhost = state.ghost;
    GHOST.opacity = 0.20 * state.ghost;
    housing.forEach(m => {
      m.material = (state.ghost > 0.02) ? GHOST : m.userData.solid;
      m.castShadow = state.ghost < 0.5;
      m.renderOrder = (state.ghost > 0.02) ? 2 : 0;
    });
  }

  // 光学件爆炸
  EXPLODE.forEach(e => {
    e.g.position.z = e.z0 + state.p * (e.k * 0.048);
  });

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);
